<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Allocation Result</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; text-align: center; }
        .result-container { padding: 2rem; border-radius: 5px; display: inline-block; min-width: 300px; margin-top: 2rem; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn { display: inline-block; margin-top: 1.5rem; padding: 0.5rem 1rem; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Allocation Result</h1>
    
    <div th:if="${message != null}" class="result-container" th:classappend="${messageType == 'success'} ? 'success' : 'error'">
        <h2 th:text="${message}">Message goes here</h2>
    </div>

    <div th:if="${message == null}">
        <p>No result to display.</p>
    </div>

    <a th:href="@{/registration/slots}" class="btn">Back to Selection</a>
</body>
</html>
